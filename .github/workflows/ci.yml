name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies with uv
        run: |
          uv venv
          if [ -s requirements.txt ]; then uv pip install -r requirements.txt; fi
          uv pip install pytest
          uv run pytest -q
          uv run python certify.py --depth 4 --gamma 3 --d 0.05 --window 0.5 --step 0.1 --out .out/certs --require-online-rate 0.95 --require-offline-rate 0.05
